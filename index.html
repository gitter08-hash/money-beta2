<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10243f" />
  <title>小金庫 Money Beta 2</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="app">
  <section id="setupPage" class="setup page">
    <div class="setup-card">
      <div class="logo">💰</div>
      <h1>歡迎使用小金庫</h1>
      <p>先建立第一位成員，之後代墊人、帳本都可以自行新增。</p>
      <label>成員名稱
        <input id="firstMember" placeholder="例如：我、家人、夥伴" />
      </label>
      <button id="startBtn" class="primary" type="button">開始使用</button>
    </div>
  </section>

  <section id="appPage" class="page active">
    <header class="hero">
      <div class="hero-top">
        <div>
          <p id="greeting">早安 ☀️</p>
          <h1>小金庫</h1>
        </div>
        <button id="backupBtn" class="round" type="button">備份</button>
      </div>
      <div class="balance-card">
        <span>總資產</span>
        <strong id="totalAsset">NT$ 0</strong>
        <small id="todaySpend">今天花費 NT$ 0</small>
      </div>
    </header>

    <nav class="pill-tabs">
      <button class="active" data-tab="home">首頁</button>
      <button data-tab="add">記帳</button>
      <button data-tab="records">明細</button>
      <button data-tab="members">成員</button>
    </nav>

    <section id="home" class="tab active">
      <div class="grid">
        <article class="mini-card"><span>👤 我的帳本</span><b id="personalTotal">NT$ 0</b></article>
        <article class="mini-card"><span>❤️ 共用帳本</span><b id="sharedTotal">NT$ 0</b></article>
      </div>

      <article class="panel">
        <h2>本月總覽</h2>
        <div class="summary">
          <div><span>收入</span><b id="monthIncome">NT$ 0</b></div>
          <div><span>支出</span><b id="monthExpense">NT$ 0</b></div>
          <div><span>結餘</span><b id="monthBalance">NT$ 0</b></div>
        </div>
      </article>

      <article class="panel">
        <div class="section-title"><h2>快速模板</h2></div>
        <div class="chips">
          <button type="button" data-template="午餐|餐飲|expense|personal">🍜 午餐</button>
          <button type="button" data-template="飲料|飲料|expense|personal">🥤 飲料</button>
          <button type="button" data-template="房租|房租|expense|personal">🏠 房租</button>
          <button type="button" data-template="毛孩|毛孩|expense|personal">🐶 毛孩</button>
        </div>
      </article>

      <article class="panel">
        <div class="section-title"><h2>最近交易</h2><button data-tab="records" class="text-btn">全部</button></div>
        <div id="recentList" class="list"></div>
      </article>
    </section>

    <section id="add" class="tab">
      <article class="panel">
        <h2 id="formTitle">快速記一筆</h2>
        <label>金額<input id="amount" type="number" inputmode="decimal" placeholder="例如 120"></label>
        <label>收入 / 支出
          <select id="type"><option value="expense">支出</option><option value="income">收入</option></select>
        </label>
        <label>帳本
          <select id="account"><option value="personal">我的帳本</option><option value="shared">共用帳本</option></select>
        </label>
        <label>資產帳戶
          <select id="asset"><option value="cash">現金</option><option value="bank">銀行</option><option value="linePay">LINE Pay</option><option value="jkoPay">街口</option><option value="creditCard">信用卡</option></select>
        </label>
        <label>分類<input id="category" placeholder="餐飲、交通、薪水..."></label>
        <label id="advanceWrap">代墊人<select id="advanceBy"></select></label>
        <label>日期<input id="date" type="date"></label>
        <label>備註<input id="note" placeholder="午餐、全聯、加油..."></label>
        <button id="saveBtn" class="primary" type="button">儲存</button>
        <button id="cancelEditBtn" class="secondary hide" type="button">取消編輯</button>
      </article>
    </section>

    <section id="records" class="tab">
      <article class="panel">
        <h2>記帳明細</h2>
        <input id="search" class="search" placeholder="搜尋分類、備註、帳戶">
        <div class="filter">
          <button class="active" data-filter="all">全部</button>
          <button data-filter="personal">個人</button>
          <button data-filter="shared">共用</button>
        </div>
        <div id="recordList" class="list"></div>
      </article>
    </section>

    <section id="members" class="tab">
      <article class="panel">
        <h2>成員管理</h2>
        <div class="row-input">
          <input id="memberName" placeholder="新增成員名稱">
          <button id="addMemberBtn" type="button">新增</button>
        </div>
        <div id="memberList" class="list"></div>
        <p class="hint">代墊人會從這裡的成員清單選取，不再寫死任何名字。</p>
      </article>
    </section>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
